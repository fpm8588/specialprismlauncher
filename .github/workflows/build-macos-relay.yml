name: Build macOS app (home relay)

# Builds only the macOS app, reusing upstream's setup and packaging steps, and produces a signed
# (ad-hoc) "Prism Launcher.app" as a downloadable zip and disk image. It builds for Apple silicon
# (M1 and later) only: a universal build compiles everything twice.
#
# Builds are cached (compiled objects and vcpkg libraries), so the first run is slow and later runs
# only recompile what changed.
#
# Run it from the Actions tab: "Build macOS app (home relay)" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Release is faster to run; Debug is quicker to build
        type: choice
        options:
          - Release
          - Debug
        default: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  macos:
    name: Build (macOS, Apple silicon)

    permissions:
      # write: the last step publishes the app as a GitHub release
      contents: write
      # Required for the vcpkg binary cache (used for Debug builds)
      packages: write

    runs-on: macos-26

    env:
      ARTIFACT_NAME: macOS-Qt6
      BUILD_PLATFORM: home-relay
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      CMAKE_PRESET: macos
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: macOS
          qt-version: 6.9.3

      # Upstream turns its compile cache on for Debug builds only; this does the same for Release.
      - name: Setup compile cache
        if: ${{ env.BUILD_TYPE == 'Release' }}
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          create-symlink: true
          key: ${{ runner.os }}-${{ runner.arch }}-home-relay-sccache

      - name: Use compile cache
        if: ${{ env.BUILD_TYPE == 'Release' }}
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      # Libraries that vcpkg builds from source (about 6 minutes the first time).
      - name: Cache vcpkg libraries
        if: ${{ env.BUILD_TYPE == 'Release' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      # The two MACOSX_SPARKLE_* values are what switch Sparkle, the macOS auto-updater, on. Emptying
      # them removes it: it would otherwise contact prismlauncher.org directly (bypassing the relay)
      # and offer to replace this fork with the stock launcher.
      - name: Configure project
        run: |
          # ENABLE_LTO=OFF: link-time optimization makes the final link very slow and the result only slightly faster.
          cmake --preset "$CMAKE_PRESET" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_LTO=OFF \
            -DMACOSX_SPARKLE_UPDATE_FEED_URL= \
            -DMACOSX_SPARKLE_UPDATE_PUBLIC_KEY=

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      # A failing test is reported but does not stop the app from being packaged. The names of failing
      # tests and the start of their output are written as annotations on the run page, and the whole
      # log is uploaded as an artifact.
      - name: Run tests
        continue-on-error: true
        run: |
          set +e
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE" --output-on-failure > ctest.log 2>&1
          status=$?
          tail -n 150 ctest.log
          if [ "$status" -ne 0 ]; then
            names=$(grep -E 'Test +#[0-9]+: .*(Failed|\*\*\*)|tests failed|The following tests FAILED|^\s+[0-9]+ - ' ctest.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Tests failed::${names}"
            detail=$(grep -n -B2 -A8 -E 'FAIL! |XFAIL|\*\*\*Failed|\*\*\*Exception|\*\*\*Timeout' ctest.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Failure details::${detail}"
          fi
          exit "$status"

      - name: Upload test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ctest-log
          path: ctest.log
          if-no-files-found: ignore

      - name: Get short version
        id: short-version
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (macOS)
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: macOS

      # Publishes the app at a permanent public address, so it can be fetched with curl from any computer:
      #   https://github.com/<owner>/<repo>/releases/download/macos-latest/PrismLauncher-macOS-arm64.dmg
      # A file downloaded with curl, or copied from a USB drive, carries no "downloaded from the internet"
      # flag, so macOS does not show the "Apple could not verify" message for it. A browser download does.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv PrismLauncher.dmg PrismLauncher-macOS-arm64.dmg
          mv PrismLauncher.zip PrismLauncher-macOS-arm64.zip
          gh release delete macos-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create macos-latest PrismLauncher-macOS-arm64.dmg PrismLauncher-macOS-arm64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "macOS app (Apple silicon), build ${{ steps.short-version.outputs.version }}" \
            --notes "Prism Launcher fork with relay support, built for Apple silicon. Not notarized by Apple."
